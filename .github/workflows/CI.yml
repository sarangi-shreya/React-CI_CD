name: "Sample React CI Pipeline/workflow"

on:
    push:
        branches:
            - main
            - master
jobs:
    build-and-test:
        runs-on: ubuntu-latest
        
        steps:
            - name: "Setup Node JS"
              uses:  actions/setup-node@v4  # "uses" is used to tell which github action is used"
              with:
                node-version: '21'
            - name:  "Check node version"
              run: node --version
